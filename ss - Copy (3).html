<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Box & Character Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-panel: #6d4c41;
            --cream-bg: rgba(255, 248, 225, 0.95);
        }

        body {
            /* تصویر پس‌زمینه کل صفحه */
            background-image: url('fg.png'); 
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
            direction: ltr;
        }
        
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2); z-index: -1;
        }

        .snowflakes {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(4px 4px at 100px 50px, #fff, transparent), 
                radial-gradient(6px 6px at 200px 150px, #fff, transparent), 
                radial-gradient(3px 3px at 300px 250px, #fff, transparent);
            background-size: 550px 550px;
            animation: snowAnim 10s linear infinite;
            opacity: 0.6;
        }
        @keyframes snowAnim { 0% { background-position: 0 0; } 100% { background-position: 100px 550px; } }

        #game-layout {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px;
            height: auto; transform-origin: center center;
        }
        @media (max-height: 850px) { #game-layout { transform: scale(0.85); } }
        @media (max-height: 700px) { #game-layout { transform: scale(0.75); } }

        .header-bar {
            width: 90%; display: flex; justify-content: space-between; margin-bottom: 5px;
        }
        .icon-btn {
            background: #ffca28; border: 3px solid #6d4c41; padding: 8px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #4e342e; color: #4e342e; font-size: 10px;
        }
        .icon-btn:active { transform: translateY(4px); box-shadow: 0 0 0; }

        .main-stage {
            display: flex; gap: 20px; align-items: flex-start; margin-top: 150px; margin-bottom: 20px;
        }

        /* --- استایل شخصیت (گولم) --- */
        .custom-character {
            position: absolute;
            /* موقعیت نسبت به بالای قاب بازی */
            top: -170px; 
            left: 50%;
            transform: translateX(-50%);
            
            height: 180px; /* ارتفاع عکس شخصیت */
            width: auto;
            z-index: 30; /* بالاتر از همه چیز */
            
            /* انیمیشن نفس کشیدن */
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* --- قاب بازی با تصویر سفارشی --- */
        .game-board-frame {
            position: relative;
            /* ================================================= */
            /* آدرس عکس جعبه/قاب خود را اینجا بگذارید */
            /* ================================================= */
            background-image: url('rt.png'); 
            
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            padding: 20px; /* فاصله داخلی برای اینکه بلوک‌ها روی لبه نروند */
            border: none; 
            background-color: transparent;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        canvas#tetris {
            background: transparent;
            display: block;
            border: none; 
        }

        .side-container { display: flex; flex-direction: column; gap: 15px; width: 100px; }
        .wood-panel {
            background: rgba(255, 248, 225, 0.95); border: 6px solid var(--wood-panel); position: relative; text-align: center; padding: 10px 0; box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
        }
        .wood-panel::before, .wood-panel::after {
            content: ''; position: absolute; width: 6px; height: 6px; background: #3e2723; border-radius: 50%; top: 4px;
        }
        .wood-panel::before { left: 4px; } .wood-panel::after { right: 4px; }

        .label-text { font-size: 9px; color: #5d4037; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
        .value-text { font-size: 13px; color: #d32f2f; text-shadow: 1px 1px 0 rgba(0,0,0,0.1); }

        .controls-wrapper {
            margin-top: 10px; display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: 60px 60px; gap: 10px; justify-items: center; align-items: center;
        }
        .ctrl-btn {
            width: 60px; height: 60px; background: linear-gradient(to bottom, #66bb6a, #43a047); border-bottom: 5px solid #1b5e20; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); user-select: none; text-shadow: 0 2px 0 #1b5e20;
        }
        .ctrl-btn:active { transform: translateY(4px); border-bottom: 0; box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
        .rotate-btn { background: linear-gradient(to bottom, #42a5f5, #1976d2); border-bottom-color: #0d47a1; }
        #btn-left { grid-column: 1; grid-row: 1; } #btn-down { grid-column: 2; grid-row: 1; } #btn-right { grid-column: 3; grid-row: 1; } #btn-rotate { grid-column: 2; grid-row: 2; }
	/* ================================================== */
/* استایل جدید ریسه چراغ کریسمس (شبیه به تصویر نمونه) */
/* ================================================== */

:root {
    /* پالت رنگی بر اساس تصویر شما */
    --bulb-red: #e53935;    /* قرمز تیره */
    --bulb-blue: #1e88e5;   /* آبی */
    --bulb-orange: #fb8c00; /* نارنجی/طلایی */
    --bulb-cyan: #26c6da;   /* فیروزه‌ای/سفید روشن */
    --wire-green: #2e7d32;  /* سبز تیره برای سیم */
}

.game-board-frame {
    position: relative;
    z-index: 5;
    /* وسط قاب باید شفاف باشد */
    background-color: transparent;
}

/* ------------------------------ */
/* لایه اول (::before): سیم سبز */
/* ------------------------------ */
.game-board-frame::before {
    content: '';
    position: absolute;
    /* سیم دقیقاً روی لبه قاب قرار می‌گیرد */
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    /* ایجاد سیم با حاشیه */
    border: 4px solid var(--wire-green);
    border-radius: 10px; /* کمی گردی */
    background: transparent;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.3); /* سایه داخلی برای حجم دادن به سیم */
    pointer-events: none;
}

/* ------------------------------ */
/* لایه دوم (::after): لامپ‌ها */
/* ------------------------------ */
.game-board-frame::after {
    content: '';
    position: absolute;
    /* لامپ‌ها کمی بیرون‌تر از سیم قرار می‌گیرند تا حالت آویزان داشته باشند */
    top: -6px;
    left: -6px;
    right: -6px;
    bottom: -6px;
    z-index: -1; /* روی سیم، ولی پشت قاب اصلی */
    background-color: transparent;
    pointer-events: none;

    /* تنظیم اندازه و تکرار برای هر ضلع */
    background-size:
        36px 12px, /* افقی (بالا) */
        36px 12px, /* افقی (پایین) */
        12px 36px, /* عمودی (چپ) */
        12px 36px; /* عمودی (راست) */

    background-repeat:
        repeat-x, repeat-x, repeat-y, repeat-y;

    background-position:
        top center, bottom center, left center, right center;

    /* انیمیشن چشمک‌زن */
    animation: bulbBlink 1.5s infinite steps(2); /* کمی کندتر (1.5s) برای آرامش بیشتر */
}

/* تعریف شکل لامپ‌ها با گرادیان */
/* این قسمت کمی پیچیده است: ما شکل بیضی (ellipse) می‌سازیم */
/* حالت ۱: قرمز و نارنجی روشن */
@mixin bulb-pattern-1 {
    background-image:
    /* بالا: قرمز */ radial-gradient(ellipse at center, var(--bulb-red) 40%, transparent 50%),
    /* پایین: نارنجی */ radial-gradient(ellipse at center, var(--bulb-orange) 40%, transparent 50%),
    /* چپ: قرمز */   radial-gradient(ellipse at center, var(--bulb-red) 40%, transparent 50%),
    /* راست: نارنجی */ radial-gradient(ellipse at center, var(--bulb-orange) 40%, transparent 50%);
}
/* حالت ۲: آبی و فیروزه‌ای روشن */
@mixin bulb-pattern-2 {
    background-image:
    /* بالا: آبی */     radial-gradient(ellipse at center, var(--bulb-blue) 40%, transparent 50%),
    /* پایین: فیروزه‌ای */ radial-gradient(ellipse at center, var(--bulb-cyan) 40%, transparent 50%),
    /* چپ: آبی */       radial-gradient(ellipse at center, var(--bulb-blue) 40%, transparent 50%),
    /* راست: فیروزه‌ای */   radial-gradient(ellipse at center, var(--bulb-cyan) 40%, transparent 50%);
}


@keyframes bulbBlink {
    0% {
        /* اعمال الگوی ۱ به صورت دستی (چون mixin در CSS خالص نداریم) */
        background-image:
            radial-gradient(ellipse at center, var(--bulb-red) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-orange) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-red) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-orange) 45%, transparent 55%);
        /* درخشش گرم */
        filter: drop-shadow(0 0 5px var(--bulb-red)) drop-shadow(0 0 5px var(--bulb-orange));
    }
    50% {
        /* اعمال الگوی ۲ */
        background-image:
            radial-gradient(ellipse at center, var(--bulb-blue) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-cyan) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-blue) 45%, transparent 55%),
            radial-gradient(ellipse at center, var(--bulb-cyan) 45%, transparent 55%);
        /* درخشش سرد */
        filter: drop-shadow(0 0 5px var(--bulb-blue)) drop-shadow(0 0 5px var(--bulb-cyan));
    }
}
    </style>
</head>
<body>

<div class="snowflakes"></div>

<div id="game-layout">
    <div class="header-bar">
        <div class="icon-btn" onclick="togglePause()">PAUSE</div>
        <div class="icon-btn" onclick="resetGame()">RESET</div>
    </div>

    <div class="main-stage">
        
        <div class="game-board-frame">
            <img src="dd.png" alt="Character" class="custom-character">
            
            <canvas id="tetris" width="240" height="400"></canvas>
        </div>

        <div class="side-container">
            <div class="wood-panel">
                <div class="label-text">NEXT</div>
                <canvas id="next" width="60" height="60"></canvas>
            </div>
            <div class="wood-panel">
                <div class="label-text">LEVEL</div>
                <div class="value-text" id="level">1</div>
                <div style="margin: 8px 0; border-top: 2px dashed #d7ccc8;"></div>
                <div class="label-text">LINES</div>
                <div class="value-text" id="lines">0</div>
            </div>
            <div class="wood-panel">
                <div class="label-text">SCORE</div>
                <div class="value-text" id="score">0</div>
            </div>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
        <div class="ctrl-btn rotate-btn" id="btn-rotate">↻</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    context.scale(20, 20);
    nextContext.scale(15, 15);

    const colors = [
        null,
        ['#e53935', '#ffeb3b'], ['#1e88e5', '#bbdefb'], ['#8e24aa', '#e1bee7'], ['#43a047', '#c8e6c9'],
        ['#fdd835', '#f57f17'], ['#00acc1', '#e0f7fa'], ['#fb8c00', '#ffe0b2'],
    ];

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0 };
    let dropCounter = 0, dropInterval = 1000, lastTime = 0, isPaused = false;
    let score = 0, lines = 0, level = 1;

    function createMatrix(w, h) {
        const matrix = []; while (h--) matrix.push(new Array(w).fill(0)); return matrix;
    }
    function createPiece(type) {
        if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
        else if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
        else if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
        else if (type === 'O') return [[4, 4],[4, 4]];
        else if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
        else if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
        else if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
    }
    function drawGift(ctx, x, y, c) {
        if(!c) return; const [main, ribbon] = colors[c];
        ctx.fillStyle = main; ctx.fillRect(x, y, 1, 1);
        ctx.lineWidth = 0.05; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.strokeRect(x, y, 1, 1);
        ctx.fillStyle = ribbon; ctx.fillRect(x + 0.35, y, 0.3, 1); ctx.fillRect(x, y + 0.35, 1, 0.3);
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x+0.1, y+0.1, 0.2, 0.2);
    }
    function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x:0, y:0}, context); drawMatrix(player.matrix, player.pos, context);
    }
    function drawMatrix(mat, off, ctx) {
        mat.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawGift(ctx, x + off.x, y + off.y, value); }); });
    }
    function drawNext() {
        nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if(player.next) drawMatrix(player.next, {x: (4-player.next[0].length)/2, y: (4-player.next.length)/2}, nextContext);
    }
    function merge(arena, player) {
        player.matrix.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value; }); });
    }
    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) { for (let x = 0; x < y; ++x) { [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]]; } }
        if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
    }
    function playerDrop() {
        player.pos.y++; if (collide(arena, player)) { player.pos.y--; merge(arena, player); playerReset(); arenaSweep(); } dropCounter = 0;
    }
    function playerMove(offset) { player.pos.x += offset; if (collide(arena, player)) player.pos.x -= offset; }
    function playerRotate(dir) {
        const pos = player.pos.x; let offset = 1; rotate(player.matrix, dir);
        while (collide(arena, player)) { player.pos.x += offset; offset = -(offset + (offset > 0 ? 1 : -1)); if (offset > player.matrix[0].length) { rotate(player.matrix, -dir); player.pos.x = pos; return; } }
    }
    function playerReset() {
        const pieces = 'TJOSZIL'; if (player.next === null) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next; player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        drawNext(); player.pos.y = 0; player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) { arena.forEach(row => row.fill(0)); score = 0; lines = 0; level = 1; updateScore(); }
    }
    function collide(arena, player) {
        const m = player.matrix; const o = player.pos;
        for (let y = 0; y < m.length; ++y) { for (let x = 0; x < m[y].length; ++x) { if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true; } } return false;
    }
    function arenaSweep() {
        let rowCount = 0; outer: for (let y = arena.length -1; y > 0; --y) { for (let x = 0; x < arena[y].length; ++x) { if (arena[y][x] === 0) continue outer; } const row = arena.splice(y, 1)[0].fill(0); arena.unshift(row); ++y; rowCount++; }
        if (rowCount > 0) { score += rowCount * 100 * level; lines += rowCount; level = Math.floor(lines / 5) + 1; dropInterval = Math.max(100, 1000 - (level * 50)); updateScore(); }
    }
    function updateScore() { document.getElementById('score').innerText = score; document.getElementById('lines').innerText = lines; document.getElementById('level').innerText = level; }
    function togglePause() { isPaused = !isPaused; }
    function resetGame() { arena.forEach(row => row.fill(0)); score = 0; lines = 0; level = 1; updateScore(); playerReset(); }
    function update(time = 0) {
        if (!isPaused) { const deltaTime = time - lastTime; lastTime = time; dropCounter += deltaTime; if (dropCounter > dropInterval) playerDrop(); draw(); } requestAnimationFrame(update);
    }
    document.addEventListener('keydown', event => { if (event.keyCode === 37) playerMove(-1); else if (event.keyCode === 39) playerMove(1); else if (event.keyCode === 40) playerDrop(); else if (event.keyCode === 38 || event.keyCode === 81) playerRotate(1); });
    document.getElementById('btn-left').addEventListener('click', () => playerMove(-1)); document.getElementById('btn-right').addEventListener('click', () => playerMove(1)); document.getElementById('btn-down').addEventListener('click', () => playerDrop()); document.getElementById('btn-rotate').addEventListener('click', () => playerRotate(1));
    playerReset(); updateScore(); update();
</script>
</body>
</html>
